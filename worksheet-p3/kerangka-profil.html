<!DOCTYPE html>
<html lang="id">
<head>
  <title>Plan Libur Semester</title>
  
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">  
</head>
<body>

  <header>
    <h1>Plan Libur Semester</h1>

    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="#plan">Plan Libur</a></li>
        <li><a href="#kegiatan">Kegiatan</a></li>
        <li><a href="#catatan">Catatan</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="plan">
      <h2>Plan Libur Semester</h2>

      <table>
        <caption>Plan Libur Semester</caption>

        <thead>
          <tr>
            <th scope="col">Hari/Tanggal</th>
            <th scope="col">Tempat yang Dikunjungi</th>
            <th scope="col">Waktu yang Ditempuh</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Minggu/17 </th>
            <td>Bandung</td>
            <td>6-7 jam</td>
          </tr>

          <tr>
            <th scope="row">Selasa/26 </th>
            <td>Solo</td>
            <td>2 jam</td>
          </tr>

          <tr>
            <th scope="row">Selasa/2 </th>
            <td>Mall</td>
            <td>1 jam</td>
          </tr>
        </tbody>
      </table>

    </section>

    <figure>
  <img src="liburan.webp"
       alt="___Pemandangan tempat liburan saya di Bandung___"
       width="640" height="360" loading="lazy">
  <figcaption>Pemandangan tempat liburan saya saat libur semester</figcaption>
</figure>


    <section id="kegiatan">
      <h2>Rencana Kegiatan</h2>

      <form action="#" method="post">

        <p>
          <label for="nama-kegiatan">Kegiatan:</label>
          <input type="text" id="nama-kegiatan" name="nama-kegiatan" required>
        </p>

        <p>
          <label for="tempat">Tempat:</label>
          <input type="text" id="tempat" name="tempat" required>
        </p>

        <p>
          <label for="tanggal">Tanggal:</label>
          <input type="date" id="tanggal" name="tanggal" required>
        </p>

        <button type="submit">Simpan</button>

      </form>
    </section>

  </main>


  <footer>
    <p>Bening Affina, NIM: 25523250, 2026</p>
  </footer>

</body>
